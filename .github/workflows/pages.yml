name: Deploy to GitHub Pages

# Two triggers:
#   - workflow_dispatch: manual "promote this build" button in the Actions tab.
#   - push of a `v*` tag: auto-publish on release tagging
#     (e.g. `git tag v1.0.0 && git push --tags`).
# Regular CI on `main` already produces the same single-file build as a
# workflow artifact; this workflow takes that build and publishes it to Pages.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Don't cancel in-flight deployments — let them
# finish so we never partially publish a build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
